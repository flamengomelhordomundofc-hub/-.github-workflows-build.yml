name: Compilar mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Preparar projeto
        run: |
          DIR=.
          if [ -f projeto.zip ]; then unzip -o projeto.zip -d projeto; DIR=projeto; fi
          echo "DIR=$DIR" >> $GITHUB_ENV
      - name: Compilar
        working-directory: ${{ env.DIR }}
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: desastres-naturais-mod
          path: ${{ env.DIR }}/build/libs/desastres-naturais-*.jar
